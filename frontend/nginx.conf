server {
    listen 8080;
    server_tokens off;
    client_max_body_size 11m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        add_header X-Correlation-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 413 '{"code":"FILE_TOO_LARGE","message":"The file exceeds the upload limit","correlationId":"$request_id"}';
    }
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 180s; }
    location /actuator/health { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
