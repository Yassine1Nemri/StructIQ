[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "structiq-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.49.0", "pypdf==7.0.0", "httpx==0.28.1", "psycopg[binary]==3.3.8"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
